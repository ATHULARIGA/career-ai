{% extends "layout.html" %}
{% block title %}Set New Password | ResuMate{% endblock %}
{% block content %}
<section class="rr-page" style="min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center;">
  <div class="rr-container" style="max-width: 440px; width: 100%;">
    <div class="rr-form" style="padding: 36px 32px; box-shadow: var(--ui-shadow);">
      <div style="text-align: center; margin-bottom: 24px;">
        <p class="rr-eyebrow" style="margin-bottom: 6px;">Account Security</p>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin: 0 0 6px; color: var(--ui-text); letter-spacing: -0.02em;">Set New Password</h1>
        <p style="font-size: 0.88rem; color: var(--ui-text-muted); margin: 0;">Create a strong, secure password for your account.</p>
      </div>

      {% if error %}
      <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); color: #ef4444; border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; font-weight: 500; margin-bottom: 18px;">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/reset-password" style="display: grid; gap: 16px;">
        <input type="hidden" name="token" value="{{ token }}">
        <input type="text" name="website" autocomplete="off" tabindex="-1" style="display:none">
        
        <div class="rr-field">
          <label for="password">New Password</label>
          <input id="password" name="password" type="password" placeholder="At least 8 chars, upper/lower/number" required autofocus>
        </div>

        <div class="rr-field">
          <label for="confirm_password">Confirm New Password</label>
          <input id="confirm_password" name="confirm_password" type="password" placeholder="Re-enter password" required>
        </div>

        <button class="rr-submit" type="submit" style="width: 100%; margin-top: 8px; padding: 12px; font-size: 0.95rem;">
          Update Password →
        </button>
      </form>

      <p style="margin: 20px 0 0; text-align: center; color: var(--ui-text-muted); font-size: 0.88rem;">
        Back to <a href="/login" style="color: #3b82f6; text-decoration: none; font-weight: 600;">Sign In</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
