{% extends "layout.html" %}
{% block title %}Admin Console Sign In | ResuMate{% endblock %}
{% block content %}
<section class="rr-page" style="min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center;">
  <div class="rr-container" style="max-width: 440px; width: 100%;">
    <div class="rr-form" style="padding: 36px 32px; box-shadow: var(--ui-shadow);">
      <div style="text-align: center; margin-bottom: 24px;">
        <p class="rr-eyebrow" style="margin-bottom: 6px;">Staff Authentication</p>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin: 0 0 6px; color: var(--ui-text); letter-spacing: -0.02em;">Operations Console</h1>
        <p style="font-size: 0.88rem; color: var(--ui-text-muted); margin: 0;">Sign in to access platform controls and telemetry.</p>
      </div>

      {% if error %}
      <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); color: #ef4444; border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; font-weight: 500; margin-bottom: 18px;">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/admin-login" style="display: grid; gap: 16px;">
        <input type="text" name="website" autocomplete="off" tabindex="-1" style="display:none">
        
        <div class="rr-field">
          <label for="username">Administrator Username</label>
          <input id="username" type="text" name="username" placeholder="admin" required autofocus>
        </div>

        <div class="rr-field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="rr-submit" style="width: 100%; margin-top: 8px; padding: 12px; font-size: 0.95rem;">
          Authenticate to Console →
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
