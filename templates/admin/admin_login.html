{% extends "layout.html" %}
{% block title %}Admin Console Sign In | ResuMate{% endblock %}
{% block content %}
<section class="al-page">
  <div class="al-card">
    <div class="al-header">
      <p class="al-eyebrow">Staff Authentication</p>
      <h1 class="al-title">Operations Console</h1>
      <p class="al-subtitle">Sign in to access platform controls and telemetry.</p>
    </div>

    {% if error %}
    <div class="al-error" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin-login" class="al-form">
      <input type="text" name="website" class="al-honeypot" autocomplete="off" tabindex="-1" aria-hidden="true">

      <div class="al-field">
        <label for="username">Administrator Username</label>
        <input id="username" type="text" name="username" placeholder="admin" required autofocus aria-label="Administrator Username">
      </div>

      <div class="al-field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="••••••••" required aria-label="Password">
      </div>

      <button type="submit" class="al-submit" aria-label="Authenticate to Console">
        Authenticate to Console &rarr;
      </button>
    </form>
  </div>
</section>
{% endblock %}
